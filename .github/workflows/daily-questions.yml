name: Generate Daily Question Set

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate daily question set
        run: python3 tools/generate_daily_questions.py questions.json daily.json

      - name: Commit and push daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git diff --staged --quiet || git commit -m "Daily question set for $(date -u +%Y-%m-%d)"
          git push
